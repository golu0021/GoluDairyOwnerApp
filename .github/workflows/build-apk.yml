name: Build Golu Dairy Farm Owner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q Golu-Dairy-Farm-Owner-Android-Project-Logo-Splash.zip -d android-build

      - name: Build APK
        working-directory: android-build
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Golu-Dairy-Farm-Owner-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
